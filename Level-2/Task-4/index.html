<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Task 4</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<nav>
    <h2>Student Portal</h2>
 <div>
   <a href="#home">Home</a>
        <a href="#register">Register</a>
        <a href="#about">About</a>
    </div>
</nav>
<main>
    <!-- HOME -->
    <section id="home" class="page">
        <div class="hero">
            <h1>Welcome to Student Portal</h1>
            <p>Complex Form Validation & Dynamic DOM Manipulation</p>
            <a href="#register" class="button">Register Now</a>
        </div>
    </section>
    <!-- REGISTER -->
    <section id="register" class="page hidden">
        <div class="form-container">
            <h1>Student Registration</h1>
            <form id="registrationForm">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
                <small id="nameError"></small>
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email">
                <small id="emailError"></small>
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password">
                <div class="strength">
                    <div id="strengthBar"></div>
                </div>
                <small id="passwordError"></small>
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password">
                <small id="confirmError"></small>
                <label>Course</label>
                <select id="course">
                    <option value="">Select Course</option>
                    <option value="CSE">Computer Science</option>
                    <option value="ECE">Electronics</option>
                    <option value="EEE">Electrical</option>
                    <option value="IT">Information Technology</option>
                </select>
                <small id="courseError"></small>
                <button type="submit">Register</button>
            </form>
            <div id="successMessage"></div>
        </div>
    </section>
    <!-- ABOUT -->
    <section id="about" class="page hidden">
        <div class="about">
            <h1>About</h1>
            <p>
                This project demonstrates complex form validation,
                password strength checking, dynamic DOM manipulation,
                and client-side routing.
            </p>
        </div>
    </section>
</main>
<script src="script.js"></script>
</body>
</html>
